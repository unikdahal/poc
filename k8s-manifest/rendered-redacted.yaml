apiVersion: v1
kind: Namespace
metadata:
  name: sail-poc
  labels:
    app.kubernetes.io/part-of: sail-poc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sail
  namespace: sail-poc
  annotations:
    eks.amazonaws.com/role-arn: unused-in-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sail-manage-pods
  namespace: sail-poc
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sail-manage-pods
  namespace: sail-poc
subjects:
- kind: ServiceAccount
  name: sail
  namespace: sail-poc
roleRef:
  kind: Role
  name: sail-manage-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-token-refresher
  namespace: sail-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-token-writer
  namespace: sail-poc
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - polaris-token
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-token-writer
  namespace: sail-poc
subjects:
- kind: ServiceAccount
  name: polaris-token-refresher
  namespace: sail-poc
roleRef:
  kind: Role
  name: polaris-token-writer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sail-poc-viewer
  namespace: sail-poc
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - events
  - services
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  - batch
  resources:
  - deployments
  - replicasets
  - cronjobs
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/portforward
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sail-poc-viewer
  namespace: sail-poc
subjects:
- kind: User
  name: poc-owner
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: sail-poc-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sail-poc-quota
  namespace: sail-poc
spec:
  hard:
    pods: '8'
    requests.cpu: '20'
    requests.memory: 40Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: polaris-client
  namespace: sail-poc
type: Opaque
stringData:
  client_id: b1066ee565e1729d
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: polaris-token-refresher
  namespace: sail-poc
spec:
  schedule: '*/20 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: polaris-token-refresher
          restartPolicy: OnFailure
          nodeSelector: {}
          containers:
          - name: refresh
            image: poc-tools:v1
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            envFrom:
            - secretRef:
                name: polaris-client
            env:
            - name: POLARIS_URI
              value: http://172.19.0.5:8181/api/catalog
            - name: POLARIS_SCOPE
              value: PRINCIPAL_ROLE:ALL
            - name: NS
              value: sail-poc
            command:
            - /bin/sh
            - -ec
            args:
            - "TOKEN=$(curl -sf -X POST \"$POLARIS_URI/v1/oauth/tokens\" \\\n  --data-urlencode\
              \ grant_type=client_credentials \\\n  --data-urlencode client_id=\"\
              \ \\\n  --data-urlencode scope=\"$POLARIS_SCOPE\" | jq -r .access_token)\n\
              [ -n \"$TOKEN\" ] && [ \"$TOKEN\" != \"null\" ] || { echo \"no token\
              \ from Polaris\"; exit 1; }\nkubectl -n \"$NS\" patch secret polaris-token\
              \ --type merge \\\n  -p \"{\\\"stringData\\\":{\\\"token\\\":\\\"$TOKEN\\\
              \"}}\"\necho \"token refreshed at $(date -u +%FT%TZ)\"\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sail-common
  namespace: sail-poc
data:
  RUST_LOG: info
  AWS_REGION: us-east-1
  SAIL_CATALOG__LIST: '[{type="iceberg-rest", name="polaris", uri="http://172.19.0.5:8181/api/catalog",
    warehouse="poc", bearer_access_token_file="/tokens/token"}]'
  SAIL_CATALOG__DEFAULT_CATALOG: polaris
  SAIL_CLUSTER__SHUFFLE_BACKEND__TYPE: flight
  AWS_ACCESS_KEY_ID: admin
  AWS_ENDPOINT: http://172.19.0.6:9000
  AWS_ALLOW_HTTP: 'true'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sail-server
  namespace: sail-poc
data:
  SAIL_MODE: kubernetes-cluster
  SAIL_CLUSTER__DRIVER_LISTEN_HOST: 0.0.0.0
  SAIL_KUBERNETES__IMAGE: ghcr.io/unikdahal/poc/sail:latest
  SAIL_KUBERNETES__IMAGE_PULL_POLICY: IfNotPresent
  SAIL_KUBERNETES__NAMESPACE: sail-poc
  SAIL_KUBERNETES__WORKER_SERVICE_ACCOUNT_NAME: sail
  SAIL_CLUSTER__WORKER_INITIAL_COUNT: '2'
  SAIL_CLUSTER__WORKER_MAX_COUNT: '3'
  SAIL_CLUSTER__WORKER_TASK_SLOTS: '2'
  SAIL_CLUSTER__WORKER_MAX_IDLE_TIME_SECS: '120'
  SAIL_KUBERNETES__WORKER_POD_TEMPLATE: "{\"metadata\": {\"labels\": {\"app.kubernetes.io/part-of\"\
    : \"sail-poc\", \"app.kubernetes.io/component\": \"worker\"}},\n \"spec\": {\n\
    \   \"nodeSelector\": {},\n   \"tolerations\": [],\n   \"containers\": [{\n  \
    \   \"name\": \"worker\",\n     \"envFrom\": [{\"configMapRef\": {\"name\": \"\
    sail-common\"}}],\n     \"env\": [\n       {\"name\": \"SAIL_RUNTIME__MEMORY_POOL__TYPE\"\
    , \"value\": \"fair\"},\n       {\"name\": \"SAIL_RUNTIME__MEMORY_POOL__FAIR__MAX_SIZE\"\
    , \"value\": \"2147483648\"},\n       {\"name\": \"SAIL_RUNTIME__TEMPORARY_FILES__PATHS\"\
    , \"value\": \"[\\\"/spill\\\"]\"}\n     ],\n     \"resources\": {\"requests\"\
    : {\"cpu\": \"2\", \"memory\": \"3Gi\"},\n                   \"limits\": {\"memory\"\
    : \"3Gi\"}},\n     \"volumeMounts\": [{\"name\": \"tokens\", \"mountPath\": \"\
    /tokens\", \"readOnly\": true},\n                      {\"name\": \"spill\", \"\
    mountPath\": \"/spill\"}]\n   }],\n   \"volumes\": [{\"name\": \"tokens\", \"\
    secret\": {\"secretName\": \"polaris-token\"}},\n               {\"name\": \"\
    spill\", \"emptyDir\": {\"sizeLimit\": \"50Gi\"}}]\n }}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sail-spark-server
  namespace: sail-poc
  labels:
    app.kubernetes.io/part-of: sail-poc
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: sail-poc
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: sail-poc
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: sail
      nodeSelector: {}
      containers:
      - name: server
        image: ghcr.io/unikdahal/poc/sail:latest
        command:
        - sail
        args:
        - spark
        - server
        - --ip
        - 0.0.0.0
        - --port
        - '50051'
        ports:
        - name: spark-connect
          containerPort: 50051
        envFrom:
        - configMapRef:
            name: sail-common
        - configMapRef:
            name: sail-server
        env:
        - name: SAIL_CLUSTER__DRIVER_EXTERNAL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SAIL_KUBERNETES__DRIVER_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            memory: 4Gi
        readinessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 10
        volumeMounts:
        - name: tokens
          mountPath: /tokens
          readOnly: true
        imagePullPolicy: IfNotPresent
      volumes:
      - name: tokens
        secret:
          secretName: polaris-token
---
apiVersion: v1
kind: Service
metadata:
  name: sail-spark-server
  namespace: sail-poc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: sail-poc
    app.kubernetes.io/component: server
  ports:
  - name: spark-connect
    port: 50051
    targetPort: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sail-poc-ingress
  namespace: sail-poc
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 50051

