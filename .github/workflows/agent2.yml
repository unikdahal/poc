name: agent2

on:
  push:
    branches: [agent2]
    paths: [".github/workflows/agent2.yml"]
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated task names, or all"
        default: all
      report_runs:
        description: "Optional JSON mapping of task names to runner IDs for report collection"
        type: string
        default: ""

permissions:
  contents: write
  packages: read
  actions: read

env:
  SAIL_TAG: 790c622e5c4d

jobs:
  tpcds:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[tpcds]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',tpcds,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Generate SF1 and compare 99 queries
        continue-on-error: true
        timeout-minutes: 310
        run: |
          python -m pip install "duckdb==1.4.4" "duckdb-extensions==1.4.4" "duckdb-extension-tpcds==1.4.4"
          python -m harness.agent2.tpcds
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-tpcds, fast-forward: "true"}

  ingest:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[ingest]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',ingest,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Write and verify SF10 tables
        continue-on-error: true
        timeout-minutes: 310
        run: python -m harness.agent2.ingest
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-ingest, fast-forward: "true"}

  memory:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[memory]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',memory,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Run spill and memory-limit cases
        continue-on-error: true
        timeout-minutes: 310
        run: python -m harness.agent2.memory
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-memory, fast-forward: "true"}

  concurrency:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[concurrency]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',concurrency,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Measure concurrent SF10 streams
        continue-on-error: true
        timeout-minutes: 310
        run: python -m harness.agent2.concurrency
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-concurrency, fast-forward: "true"}

  udf:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[udf]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',udf,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - uses: actions/setup-python@v5
        id: udf-python
        with:
          python-version: "3.14"
          update-environment: false
      - name: Compare Python evaluation paths
        continue-on-error: true
        timeout-minutes: 90
        run: |
          "${{ steps.udf-python.outputs.python-path }}" -m venv "$RUNNER_TEMP/agent2-udf"
          "$RUNNER_TEMP/agent2-udf/bin/python" -m pip install "pyspark-client==4.2.1" requests psutil
          python -m harness.agent2.udf --sail-python "$RUNNER_TEMP/agent2-udf/bin/python"
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-udf, fast-forward: "true"}

  catalog:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',catalog,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      POLARIS_ACCESS_LOG: "true"
      POLARIS_TOKEN_LIFETIME: PT90S
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Measure catalog scale and token refresh
        continue-on-error: true
        timeout-minutes: 310
        run: python -m harness.agent2.catalog
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-catalog, fast-forward: "true"}

  flight-leak:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[flight-leak]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',flight-leak,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Observe ticket expiry and cancellation
        continue-on-error: true
        timeout-minutes: 90
        run: python -m harness.agent2.flight_leak
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-flight-leak, fast-forward: "true"}

  celeborn:
    if: github.ref == 'refs/heads/agent2' && inputs.report_runs == '' && (github.event_name == 'push' && contains(github.event.head_commit.message, '[celeborn]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',celeborn,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Measure shuffle settings and interrupt a worker
        continue-on-error: true
        timeout-minutes: 310
        run: python -m harness.agent2.celeborn
      - uses: ./.github/actions/publish
        if: always()
        with: {name: agent2-celeborn, fast-forward: "true"}

  release-vs-main:
    if: github.ref == 'refs/heads/agent2' && (inputs.report_runs != '' || github.event_name == 'push' && contains(github.event.head_commit.message, '[release-vs-main]') || inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',release-vs-main,'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Collect completed reports
        if: inputs.report_runs != ''
        env:
          AGENT2_REPORT_RUNS: ${{ inputs.report_runs }}
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 340
        run: python -m harness.agent2.report
      - uses: ./.github/actions/setup
        if: inputs.report_runs == ''
        with: {sail-tag: "${{ env.SAIL_TAG }}"}
      - name: Compare SF10 main and release builds
        if: inputs.report_runs == ''
        continue-on-error: true
        timeout-minutes: 310
        run: python -m harness.agent2.release_vs_main
      - uses: ./.github/actions/publish
        if: always() && inputs.report_runs == ''
        with: {name: agent2-release-vs-main, fast-forward: "true"}
