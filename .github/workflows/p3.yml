name: Phase 3

on:
  push:
    branches: [agent2-phase3]
    paths: [".github/workflows/p3.yml"]
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated task names, all, or build-latest"
        default: all

permissions:
  contents: write
  packages: read

env:
  P3_PINNED_SHA: 790c622e5c4d9a9e2b87bdfb8e5cb5a3a720035f
  P3_NEW_SHA: da1e7351d28046452f0ec3e8232aee28458f3852

jobs:
  latest-image:
    if: github.ref == 'refs/heads/agent2-phase3' && (inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',rootcause,') || contains(format(',{0},', inputs.tasks), ',build-latest,') || contains(github.event.head_commit.message, '[p3-build]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
      - name: Build pinned upstream main
        continue-on-error: true
        timeout-minutes: 325
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash scripts/p3-build.sh
      - name: Publish build evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/p3-publish.sh rootcause build-latest out

  rootcause:
    if: github.ref == 'refs/heads/agent2-phase3' && (inputs.tasks == 'all' || contains(format(',{0},', inputs.tasks), ',rootcause,') || contains(format(',{0},', inputs.tasks), ',rootcause-newer,'))
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: [pinned, newer]
    env:
      P3_VARIANT: ${{ matrix.variant }}
      PYTHONPATH: ${{ github.workspace }}
      POC_OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.18"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17.0.21"
      - name: Set up pinned services
        if: matrix.variant == 'pinned' || contains(format(',{0},', inputs.tasks), ',rootcause-newer,')
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/p3-setup.sh
      - name: Compare full outputs and reduced cases
        if: steps.setup.conclusion == 'success'
        continue-on-error: true
        timeout-minutes: 280
        run: python -m harness.p3.rootcause
      - name: Publish correctness evidence
        if: always() && (matrix.variant == 'pinned' || contains(format(',{0},', inputs.tasks), ',rootcause-newer,'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/p3-publish.sh rootcause "$P3_VARIANT" out
