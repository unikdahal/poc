# Shared infrastructure for the POC. All engines reach it on the `poc` network
# (Sail containers) or through published ports on localhost (Spark on the host).
name: poc
networks:
  default:
    name: poc

services:
  minio:
    # S3-compatible object store. RustFS (as in Apache Polaris' getting-started examples);
    # the service keeps the name `minio` so endpoints read http://minio:9000.
    image: rustfs/rustfs:${RUSTFS_TAG:-1.0.0-beta.8}
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health"]
      interval: 3s
      retries: 40

  minio-setup:
    image: amazon/aws-cli:${AWSCLI_TAG:-2.39.6}
    depends_on:
      minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for b in warehouse shuffle raw; do aws s3 mb s3://$$b || true; done && aws s3 ls && echo buckets-ready

  polaris:
    image: apache/polaris:${POLARIS_TAG:-latest}
    depends_on:
      minio-setup: {condition: service_completed_successfully}
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      quarkus.http.access-log.enabled: "${POLARIS_ACCESS_LOG:-false}"
      quarkus.http.access-log.pattern: "agent2-access %m %U %s"
      polaris.authentication.token-broker.max-token-generation: "${POLARIS_TOKEN_LIFETIME:-PT1H}"
    ports: ["8181:8181", "8182:8182"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 2s
      retries: 60

  celeborn-master:
    image: apache/celeborn:${CELEBORN_TAG:-0.6.3}
    hostname: celeborn-master
    environment:
      CELEBORN_LOCAL_HOSTNAME: celeborn-master
      CELEBORN_MASTER_MEMORY: 512m
      CELEBORN_NO_DAEMONIZE: "1"
    command: ["start-master.sh", "--host", "celeborn-master", "--port", "12097"]
    volumes:
      - ./celeborn-defaults.conf:/opt/celeborn/conf/celeborn-defaults.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/celeborn-master/12097'"]
      start_period: 15s
      interval: 5s
      retries: 12
    profiles: [celeborn]

  celeborn-worker:
    image: apache/celeborn:${CELEBORN_TAG:-0.6.3}
    hostname: celeborn-worker
    depends_on:
      celeborn-master: {condition: service_healthy}
    environment:
      CELEBORN_LOCAL_HOSTNAME: celeborn-worker
      CELEBORN_NO_DAEMONIZE: "1"
      CELEBORN_WORKER_MEMORY: 1g
      CELEBORN_WORKER_OFFHEAP_MEMORY: 1g
    command: ["start-worker.sh", "--host", "celeborn-worker", "--port", "12000", "celeborn://celeborn-master:12097"]
    volumes:
      - ./celeborn-defaults.conf:/opt/celeborn/conf/celeborn-defaults.conf:ro
    profiles: [celeborn]
